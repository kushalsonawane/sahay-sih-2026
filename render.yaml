services:
  - type: web
    name: sahay-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build --workspace=packages/shared && npm run build:render --workspace=apps/api
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
